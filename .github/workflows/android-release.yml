name: Android APK CI

on:
  push:
    branches:
      - main
      - apk-release
    paths:
      - 'releases/WebViewApp/**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 31
          build-tools: 31.0.0
          ndk: false

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Prepare Gradle wrapper JAR (if missing)
        working-directory: releases/WebViewApp
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sL https://repo1.maven.org/maven2/org/gradle/gradle-wrapper/7.0.2/gradle-wrapper-7.0.2.jar -o gradle/wrapper/gradle-wrapper.jar
          fi
      - name: Build Release APK
        working-directory: releases/WebViewApp
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK for Release
        run: mv releases/WebViewApp/app/build/outputs/apk/release/app-release.apk releases/WebViewApp/app/build/outputs/apk/release/aetheria-space-weather.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: aetheria-space-weather-apk
          path: releases/WebViewApp/app/build/outputs/apk/release/aetheria-space-weather.apk

      - name: Create Tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: Aetheria Android Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: releases/WebViewApp/app/build/outputs/apk/release/aetheria-space-weather.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/apk-release'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: 'latest'
          name: 'Latest Development Build'
          body: 'This is the latest continuous build from the main branch. This APK is for testing purposes and may be unstable.'
          draft: false
          prerelease: true
          allow_updates: true
          files: releases/WebViewApp/app/build/outputs/apk/release/aetheria-space-weather.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

