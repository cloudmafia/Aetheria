name: Android APK CI

on:
  push:
    branches:
      - main
      - apk-release
    paths:
      - 'solar-horizon-watch/releases/WebViewApp/**'
      - '.github/workflows/android-release.yml'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Prepare Gradle wrapper JAR (if missing)
        working-directory: solar-horizon-watch/releases/WebViewApp
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sL https://repo1.maven.org/maven2/org/gradle/gradle-wrapper/7.0.2/gradle-wrapper-7.0.2.jar -o gradle/wrapper/gradle-wrapper.jar
          fi
      - name: Make Gradle wrapper executable
        working-directory: solar-horizon-watch/releases/WebViewApp
        run: chmod +x ./gradlew
        
      - name: Build Release APK
        working-directory: solar-horizon-watch/releases/WebViewApp
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK for Release
        run: mv solar-horizon-watch/releases/WebViewApp/app/build/outputs/apk/release/app-release.apk solar-horizon-watch/releases/WebViewApp/app/build/outputs/apk/release/aetheria-space-weather.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheria-space-weather-apk
          path: solar-horizon-watch/releases/WebViewApp/app/build/outputs/apk/release/aetheria-space-weather.apk

      - name: Create Tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: Aetheria Android Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: solar-horizon-watch/releases/WebViewApp/app/build/outputs/apk/release/aetheria-space-weather.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Update or create the 'latest' GitHub Release. softprops/action-gh-release will
      # automatically update an existing release with the same tag if it exists.
      - name: Publish/Update 'latest' GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/apk-release'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: 'latest'
          name: 'Latest Development Build'
          body: 'This is the latest continuous build from the main branch. This APK is for testing purposes and may be unstable.'
          draft: false
          prerelease: true
          fail_on_unmatched_files: false
          files: solar-horizon-watch/releases/WebViewApp/app/build/outputs/apk/release/aetheria-space-weather.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

